<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DocNuvem API Tester</title>
<style>
/* Interface moderna: barra superior, menu lateral, cartões. Tema claro/escuro (segue o sistema; o botão da barra troca). */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#f0f2f5; --border:#e3e6eb; --border2:#cdd2da;
  --text:#14181f; --muted:#5f6b7a; --faint:#8c96a3;
  --accent:#2563eb; --accent-h:#1d4ed8; --accent-soft:#e8efff; --on-accent:#ffffff;
  --ok:#15803d; --ok-soft:#e6f5ec; --warn:#a15c07; --warn-soft:#fdf1d6; --err:#b42318; --err-soft:#fdeceb; --info:#0b6bcb;
  --jk:#0b6bcb; --js:#9a5b00; --jn:#0f7b3f; --jb:#8a3fb5;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --shadow-lg:0 12px 32px rgba(16,24,40,.18);
  --radius:12px; --r-sm:8px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0d1117; --surface:#151b23; --surface2:#1c232d; --border:#2a323d; --border2:#3a4452;
  --text:#e6edf3; --muted:#9aa6b2; --faint:#6e7a88;
  --accent:#58a6ff; --accent-h:#79b8ff; --accent-soft:#12284a; --on-accent:#0b1220;
  --ok:#3fb950; --ok-soft:#0f2a19; --warn:#d9a21b; --warn-soft:#2d2308; --err:#f85149; --err-soft:#341412; --info:#58a6ff;
  --jk:#79b8ff; --js:#e3b341; --jn:#56d364; --jb:#d2a8ff;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 12px 32px rgba(0,0,0,.55);
  color-scheme:dark;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#0d1117; --surface:#151b23; --surface2:#1c232d; --border:#2a323d; --border2:#3a4452;
    --text:#e6edf3; --muted:#9aa6b2; --faint:#6e7a88;
    --accent:#58a6ff; --accent-h:#79b8ff; --accent-soft:#12284a; --on-accent:#0b1220;
    --ok:#3fb950; --ok-soft:#0f2a19; --warn:#d9a21b; --warn-soft:#2d2308; --err:#f85149; --err-soft:#341412; --info:#58a6ff;
    --jk:#79b8ff; --js:#e3b341; --jn:#56d364; --jb:#d2a8ff;
    --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 12px 32px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0}
code,kbd,pre{font-family:var(--mono)}
code{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:1px 6px;font-size:12.5px}
kbd{font-size:11px;color:var(--muted);background:var(--surface2);border:1px solid var(--border2);border-bottom-width:2px;border-radius:5px;padding:0 5px;line-height:1.5}
.dim{color:var(--muted)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent-soft)}
a,.lnk{color:var(--accent)}
svg{flex:none}

#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}

/* barra superior */
.topbar{display:flex;align-items:center;gap:10px;padding:0 18px;min-height:58px;background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:30;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:14px}
.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;font-weight:800;font-size:17px}
.bt{display:flex;flex-direction:column;line-height:1.15}
.bt b{font-size:15px;letter-spacing:-.01em}
.bt small{color:var(--muted);font-size:11.5px}
.pal{display:flex;align-items:center;gap:8px;min-width:240px;height:36px;padding:0 10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--muted);cursor:pointer}
.pal:hover{border-color:var(--border2);color:var(--text)}
.pal span{flex:1;text-align:left}
.sp{flex:1}
.flag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--warn-soft);color:var(--warn)}
.flag.live{background:var(--err-soft);color:var(--err)}
.flag.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.tbtn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;background:transparent;border:1px solid transparent;border-radius:var(--r-sm);color:var(--text);cursor:pointer}
.tbtn:hover,.tbtn.on{background:var(--surface2)}
.tbtn.sq{width:36px;padding:0;justify-content:center}
.chip-prof{display:inline-flex;align-items:center;gap:10px;height:36px;padding:0 10px 0 12px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-sm);cursor:pointer}
.chip-prof:hover,.chip-prof.on{background:var(--surface2)}
.chip-prof .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.chip-prof .dot.off{background:var(--err)}
.chip-prof .tk{font-family:var(--mono);font-size:12px;color:var(--muted)}
.mi{position:relative}
.dd{position:absolute;right:0;top:calc(100% + 6px);min-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:6px;z-index:50}
.dd button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:16px;background:transparent;border:0;border-radius:var(--r-sm);text-align:left;padding:8px 10px;cursor:pointer;color:var(--text)}
.dd button:hover,.dd button:focus-visible{background:var(--surface2);outline:0}
.dd button .k{color:var(--muted);font-family:var(--mono);font-size:12px}
.dd button.sel{background:var(--accent-soft)}
.dd hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.dd .cap{padding:6px 10px 2px;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* corpo */
.body{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:0}
.side{background:var(--surface);border-right:1px solid var(--border);padding:14px 12px 20px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.side h3{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:16px 10px 6px}
.side h3:first-child{margin-top:4px}
.nav{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-radius:var(--r-sm);padding:8px 10px;cursor:pointer;color:var(--text);position:relative}
.nav:hover{background:var(--surface2)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav .ni{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--surface2);color:var(--muted)}
.nav.on .ni{background:var(--accent);color:var(--on-accent)}
.nav .nt{display:flex;flex-direction:column;min-width:0;flex:1}
.nav .nt b{font-weight:600;font-size:13.5px}
.nav .nt small{color:var(--muted);font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav.on .nt small{color:inherit;opacity:.8}
.nav .nk{color:var(--faint);font-size:11px;font-family:var(--mono)}
.main{overflow:auto;padding:28px 32px 56px;min-width:0}
.screen{max-width:1500px;margin:0 auto;display:flex;flex-direction:column}

/* cabeçalho de página */
.sh h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
.sh .ep{display:flex;gap:10px;align-items:center;margin:10px 0 6px;flex-wrap:wrap;overflow-wrap:anywhere}
.sh .desc{margin:4px 0 0;max-width:78ch;color:var(--muted)}
.mb-m{display:inline-block;padding:2px 9px;border-radius:6px;font-family:var(--mono);font-weight:700;font-size:11.5px;letter-spacing:.02em}
.m-GET{background:#dff1ff;color:#0b5cad}.m-POST{background:#dcf5e5;color:#116b33}.m-DELETE{background:#fde3e1;color:#a52118}.m-FLUXO{background:#fdf0cf;color:#8a5a00}
:root[data-theme=dark] .m-GET{background:#12304f;color:#79b8ff}:root[data-theme=dark] .m-POST{background:#10301d;color:#56d364}:root[data-theme=dark] .m-DELETE{background:#3a1613;color:#ff8a82}:root[data-theme=dark] .m-FLUXO{background:#352a0a;color:#e3b341}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .m-GET{background:#12304f;color:#79b8ff}:root:not([data-theme=light]) .m-POST{background:#10301d;color:#56d364}:root:not([data-theme=light]) .m-DELETE{background:#3a1613;color:#ff8a82}:root:not([data-theme=light]) .m-FLUXO{background:#352a0a;color:#e3b341}}
.split,.one{display:grid;grid-template-columns:minmax(0,1fr);gap:0 24px;margin-top:4px;align-items:start}
.col{min-width:0;display:flex;flex-direction:column}
@media(min-width:1240px){.split{grid-template-columns:minmax(0,1fr) minmax(0,1.08fr)}}

/* cartões */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-top:18px;min-width:0}
.ct{font-size:15px;font-weight:650;letter-spacing:-.005em;margin:0 0 14px}
.panel{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:12px 0}
.callout{border-radius:10px;padding:12px 14px;margin:14px 0 0;border:1px solid var(--border);background:var(--surface2)}
.callout.live{background:var(--err-soft);border-color:transparent;color:var(--err)}
.callout b{font-weight:650}

/* campos */
.fld{display:grid;gap:6px;margin:0 0 16px;min-width:0}
.fld label{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.fld .lb{font-weight:600}
.fld .rq{color:var(--err);font-weight:700}
.fld .pn{color:var(--faint);font-family:var(--mono);font-size:11.5px}
.fld input[type=text],.fld input[type=search],.fld select,.fld textarea,.dtq,.mi-in{width:100%;min-height:38px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-sm);padding:7px 11px}
.fld textarea{resize:vertical;line-height:1.45}
.fld input:hover,.fld select:hover,.fld textarea:hover{border-color:var(--faint)}
.fld input:focus,.fld select:focus,.fld textarea:focus,.dtq:focus,.mi-in:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld input::placeholder,.fld textarea::placeholder{color:var(--faint)}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--err);box-shadow:0 0 0 3px var(--err-soft)}
.fld.warned input{border-color:var(--warn)}
.fld .help{color:var(--muted);font-size:12.5px}
.fld .note{color:var(--warn);font-size:12.5px}
.fld.dis input,.fld.dis select,.fld.dis textarea{background:var(--surface2);border-style:dashed;color:var(--faint);cursor:not-allowed}
.fld.dis .lb{color:var(--muted)}
.fld.chk .chkrow{display:flex;gap:10px;align-items:center;cursor:pointer}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:17px;height:17px}
.msg{font-size:12.5px;min-height:0}
.msg.err{color:var(--err);font-weight:500}
.msg.warn{color:var(--warn)}
.msg.err::before{content:"✕ ";font-weight:700}
.msg.warn::before{content:"! ";font-weight:700}
.msg:empty{display:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:0 18px}
.chkline{display:flex;gap:10px;align-items:center;margin:0 0 10px;cursor:pointer}
.radio{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:10px}
.radio label{display:flex;gap:8px;align-items:center;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 14px;background:var(--surface);color:var(--text);border:1px solid var(--border2);border-radius:var(--r-sm);cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.pri kbd{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3);color:inherit}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff}
.btn.danger:hover{filter:brightness(1.1)}
.btn.sm{min-height:28px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.copied{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 4px;align-items:center}
.lnk{background:none;border:0;text-decoration:underline;cursor:pointer;padding:0}

/* sinalização */
.errbox{background:var(--err-soft);border:1px solid transparent;border-left:4px solid var(--err);border-radius:var(--r-sm);color:var(--text);padding:12px 16px;margin:12px 0;overflow-wrap:anywhere}
.errbox h4{margin:0 0 4px;font-size:14px;color:var(--err)}
.errbox .row{margin-top:6px}
.errbox .hint{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 10px;margin-top:10px}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:var(--r-sm);padding:10px 14px;margin:12px 0;font-weight:550}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:var(--r-sm);padding:10px 14px;margin:10px 0}
.st{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:700;font-size:12.5px}
.st.ok{background:var(--ok-soft);color:var(--ok)}.st.err{background:var(--err-soft);color:var(--err)}.st.warn{background:var(--warn-soft);color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-weight:600;font-size:12px;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.pendente{background:var(--warn-soft);color:var(--warn)}.pill.assinado{background:var(--ok-soft);color:var(--ok)}
.pill.expirado{background:var(--surface2);color:var(--muted)}.pill.cancelado{background:var(--err-soft);color:var(--err)}
.pill.sem_assinatura{background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--muted);padding:14px 4px;text-align:center}
.empty b{color:var(--text)}
.chip{display:inline-flex;gap:10px;align-items:baseline;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:4px 12px;cursor:copy;max-width:100%;overflow-wrap:anywhere;text-align:left}
.chip .cl{color:var(--muted);font-size:12px}
.chip b{font-family:var(--mono);font-weight:650}
.chip:hover{border-color:var(--accent)}
.chip.copied::after,.jl.copied::after,.jc.copied::after{content:" ✓ Copiado";color:var(--ok);font-weight:700}
.chiprow{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.loading{display:flex;flex-direction:column;gap:8px;padding:8px 0}
.spinner{display:inline-block;width:18px;height:18px;border:2.5px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-4px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spinner,.flag.live::before{animation:none}}

/* resultado */
.tabs{display:inline-flex;gap:2px;background:var(--surface2);padding:3px;border-radius:10px;margin:12px 0 12px;flex-wrap:wrap}
.tab{background:transparent;border:0;padding:5px 14px;cursor:pointer;color:var(--muted);border-radius:7px;font-weight:550}
.tab.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.tab:hover:not(.on){color:var(--text)}
.reshead{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap}
.url{overflow-wrap:anywhere;word-break:break-all}
.urlbar{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 12px;overflow-wrap:anywhere;word-break:break-all;margin:10px 0;font-family:var(--mono);font-size:12.5px}
.urlbar .qk{color:var(--muted)}.urlbar .qv{color:var(--accent)}
.urlbar .btn{margin-left:6px;font-family:var(--sans)}
pre.prev{margin:8px 0 0;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;overflow:auto;max-height:280px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12.5px}
details.det{margin-top:12px;border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 12px}
details.det summary{cursor:pointer;color:var(--muted);font-weight:550;padding:4px 0}
details.det[open] summary{color:var(--text)}
.jv{font-family:var(--mono);font-size:12.8px;line-height:1.6}
.jtools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.jn{margin-left:16px;padding-left:12px;border-left:1px solid var(--border)}
.jr{overflow-wrap:anywhere;word-break:break-word}
.jk{color:var(--jk)}
.jl{cursor:copy;padding:0 2px;border-radius:4px}
.jl:hover{background:var(--surface2);outline:1px solid var(--border2)}
.jstr{color:var(--js)}.jnum{color:var(--jn)}.jbool{color:var(--jb)}
.jt{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 4px;width:2.2ch}
.jc{background:none;border:0;color:var(--faint);cursor:copy;padding:0 6px;font-size:12px}
.jc:hover{color:var(--accent)}
.jsum{color:var(--muted)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;margin:8px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}

/* tabelas */
.dt .bar{display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.dtq{max-width:340px}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;color:var(--muted);background:var(--surface2);border-bottom:1px solid var(--border);padding:0;white-space:nowrap;font-size:12px;letter-spacing:.02em}
.thb{background:none;border:0;color:var(--muted);padding:9px 12px;cursor:pointer;font-weight:650;font-size:12px}
button.thb:hover{color:var(--text)}
td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--border);overflow-wrap:break-word}
.tw table{min-width:560px}
tbody tr:last-child td{border-bottom:0}
td.nw{white-space:nowrap}
tr.clk{cursor:pointer}
tr.clk:hover td,tr.clk:focus-visible td{background:var(--surface2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.bigtime{font-size:44px;line-height:1.1;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:8px 0 2px}
.bigtime.low{color:var(--err)}
.pbar{height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin:10px 0 2px}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width 1s linear}
.pbar.low i{background:var(--err)}
.pager{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}

/* signatários */
.sigs{display:flex;flex-direction:column;gap:12px}
.srow{border:1px solid var(--border);background:var(--surface2);border-radius:10px;padding:12px 14px 2px}
.srow-h{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.srow-h b{flex:1}
.srow .fld input[type=text]{background:var(--surface)}
.stepper{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0}
.stp{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid var(--border);border-radius:99px;color:var(--muted);background:var(--surface);font-weight:550}
.stp.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stp.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.linkrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-bottom:1px solid var(--border);padding:12px 0}
.linkrow:last-of-type{border-bottom:0}
.linkrow .nm{font-weight:600}
.linkrow .lk{color:var(--accent);overflow-wrap:anywhere;word-break:break-all;font-family:var(--mono);font-size:12.5px;margin-top:2px}
.biglinks .lk{font-size:14px}

/* início */

  const el=document.createElement(tag);

  }
  for(const kid of kids.flat(Infinity)){if(kid==null||kid===false)continue;el.append(kid.nodeType?kid:document.createTextNode(kid));}
  return el;
}

  const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(s).trim());if(!m)return null;
  const d=+m[1],mo=+m[2],y=+m[3];const dt=new Date(y,mo-1,d);

function hImport(D,b,file){
  if(!file)return E(400,'Arquivo não enviado. Envie o conteúdo na parte "arquivo" do multipart.',{campo:'arquivo'});

const signDefaults=()=>({documentoId:'',sigs:[{nome:'',email:'',cpf:'',telefone:'',ordem:'0'}],autoOrd:true,consideraOrdem:false,vTipo:'dias',dataValidade:'',prazoDias:'30',metodos:'eletronica',textoEmail:'',referenciaExterna:'',loginSolicitante:'',lembretes:'1,7'});
function SigList(st,o){
  const box=h('div',{class:'sigs'});let rowsF=[];const listMsg=h('div',{class:'msg'});

  const dup=(k,i,v)=>v&&st.sigs.some((s,j)=>j!==i&&String(s[k]).trim().toLowerCase()===v.trim().toLowerCase());

    rowsF=[];box.replaceChildren();
    if(!st.sigs.length)box.append(h('div',{class:'empty'},'Nenhum signatário. Use ',h('b',{},'+ Adicionar signatário'),'.'));
    st.sigs.forEach((s,i)=>{
      const mk=(k,l,x)=>Field(s,{key:k,label:l,change:o.change,...x});
      const f={
        nome:mk('nome','Nome',{req:true,param:'nome',check:v=>v.trim()&&v.trim().split(/\s+/).length<2?{warn:'Informe nome e sobrenome.'}:null}),
        email:mk('email','E-mail',{req:true,param:'email',check:v=>!EMAIL_RE.test(v.trim())?'E-mail inválido.':dup('email',i,v)?{warn:'E-mail repetido na lista.'}:null}),
        cpf:mk('cpf','CPF',{req:true,param:'cpf',ph:'000.000.000-00',fmt:cpfFmt,check:v=>{const d=digits(v);return d.length<11?'CPF incompleto (11 dígitos).':!cpfValid(d)?'CPF inválido: o dígito verificador não confere.':dup('cpf',i,v)?{warn:'CPF repetido na lista.'}:null;}}),
        telefone:mk('telefone','Telefone',{param:'telefone (opcional)',ph:'(11) 91234-5678',check:v=>v.trim()&&![10,11].includes(digits(v).length)?{warn:'Esperado DDD + 8 ou 9 dígitos.'}:null}),
        ordem:mk('ordem','Ordem',{param:'ordem (0-based)',check:v=>{
          if(!/^-?\d+$/.test(String(v).trim()))return 'A ordem deve ser um número inteiro.';
          if(o.considera()){const n=st.sigs.length;const set=st.sigs.map(x=>String(x.ordem).trim()).sort((a,b)=>a-b);
            if(!set.every((x,k)=>x===String(k)))return `Com ordem ligada deve ser 0-based e contígua (0 a ${n-1}) e sem repetição.`;}

      };

        h('button',{type:'button',class:'btn sm',title:'Descer',disabled:i===st.sigs.length-1,onclick:()=>move(i,1)},'▼'),
        h('button',{type:'button',class:'btn sm danger',title:'Remover',onclick:()=>{st.sigs.splice(i,1);renum();render();o.change();}},'✕ remover')),
        h('div',{class:'grid2'},f.nome.el,f.email.el,f.cpf.el,f.telefone.el,f.ordem.el)));
    });
  }
  function move(i,d){const j=i+d;[st.sigs[i],st.sigs[j]]=[st.sigs[j],st.sigs[i]];renum();render();o.change();}
  const add=()=>{st.sigs.push({nome:'',email:'',cpf:'',telefone:'',ordem:String(st.sigs.length)});renum();render();o.change();const last=box.querySelector('.srow:last-child input');last&&last.focus();};
  const autoChk=h('input',{type:'checkbox',id:uid(),checked:!!st.autoOrd,onchange:e=>{st.autoOrd=e.target.checked;renum();render();o.change();}});
  const el=h('div',{},box,listMsg,h('div',{class:'acts'},h('button',{type:'button',class:'btn',onclick:add},'+ Adicionar signatário'),h('button',{type:'button',class:'btn',onclick:()=>{renum();render();o.change();}},'Renumerar 0..n')),
    h('label',{class:'chkline'},autoChk,h('span',{},'Ordem automática (0..n-1). Desligue para testar ordens inválidas.')));
  render();
  return {el,
    validate(){let ok=true;listMsg.textContent='';listMsg.className='msg';
      if(!st.sigs.length){listMsg.className='msg err';listMsg.textContent='Informe ao menos um signatário.';return false;}
      for(const f of rowsF)for(const k of Object.values(f))if(!k.validate(true))ok=false;return ok;},
    refreshOrder(){rowsF.forEach(f=>f.ordem.validate(true));},
    fill(ex){st.sigs=ex.map((n,i)=>({nome:NOMES[n][0],email:NOMES[n][1]+'@exemplo.com.br',cpf:cpfFmt(SEEDCPF[n]),telefone:'(11) 9'+String(1000+n*137).padStart(4,'0')+'-'+String(2000+n*311).slice(0,4),ordem:String(i)}));render();},
    payload(){return st.sigs.map(s=>{const t=digits(s.telefone);const on=String(s.ordem).trim();return {nome:s.nome.trim(),email:s.email.trim(),cpf:digits(s.cpf),...(t?{telefone:t}:{}),ordem:/^-?\d+$/.test(on)?Number(on):on};});}};
}

function FlowScreen(){

  const sh=Shell({title:'Fluxo completo',method:null,path:'importar → solicitar assinatura → links',desc:'Importa um arquivo e já solicita a assinatura usando o documentoId retornado. Ao fim, mostra o link de cada signatário.'});

    const r=await fetch('/_perfis',{cache:'no-store'});
    if(r.ok){const j=await r.json();
      if(j&&Array.isArray(j.perfis)&&j.perfis.length){LIVE=j;PROFILES=j.perfis.map(p=>({id:p.id,instancia:p.instancia,baseUrl:p.baseUrl,mascara:p.tokenMascarado,token:''}));state.profile=PROFILES.find(p=>p.id===j.padrao)||PROFILES[0];}}
  }catch{}
  if(!LIVE)state.catalog=MODELOS;
  state.logOpen=innerWidth>=1500&&innerHeight>=900;
  renderMenubar();renderLog();go('home');
}
boot();
})();
</script>
</body>
</html>
