[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docnuvem-tester"
version = "2.0.0"
description = "Interface web para testar manualmente a API REST do Docnuvem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.9",
]

[project.scripts]
docnuvem-web = "docnuvem_tester.web:main"
docnuvem-spec = "docnuvem_tester.spec:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docnuvem_tester = ["webapp/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/docnuvem_tester/webapp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src"]
