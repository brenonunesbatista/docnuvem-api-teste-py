[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docnuvem-tester"
version = "1.0.0"
description = "TUI (Textual) para testar manualmente a API REST do Docnuvem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.60",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "textual-dev>=1.5",
    "mypy>=1.9",
]

[project.scripts]
docnuvem-tester = "docnuvem_tester.app:main"
docnuvem-web = "docnuvem_tester.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docnuvem_tester = ["styles/*.tcss", "webapp/*.html", "webapp/*.js", "webapp/*.png"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
